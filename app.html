:root{--nf-ease:cubic-bezier(.2,.75,.25,1)}

.page-row{animation:rowIn .35s var(--nf-ease) both}

.content h1{letter-spacing:-.055em}
.content .eyebrow{letter-spacing:.14em}
.settings-row:hover{border-color:#cbd7cb}
.transfer-panel{margin-top:22px;border:1px solid var(--line);border-radius:16px;padding:22px;background:linear-gradient(135deg,var(--panel),color-mix(in srgb,var(--accent-soft) 40%,var(--panel)));box-shadow:0 12px 35px #24252206}
.transfer-panel h3{margin:0 0 7px;font-size:16px}

.transfer-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}

.transfer-panel input:focus,.transfer-panel textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}

/* Notebook app motion system: soft page arrivals, staggered cards, and tactile controls */
#mainContent{animation:workspaceArrive .42s cubic-bezier(.2,.75,.25,1) both}
.stat,.quick-card,.page-row,.tip-box,.focus-box,.transfer-panel{animation:cardArrive .48s cubic-bezier(.2,.75,.25,1) both}
.quick-card:nth-child(2),.stat:nth-child(2){animation-delay:.05s}.quick-card:nth-child(3),.stat:nth-child(3){animation-delay:.1s}

.primary:active,.secondary:active,.icon-btn:active{transform:scale(.97)}

function fitTitle(el){if(!el)return;el.style.height='auto';el.style.height=el.scrollHeight+'px'}function scheduleSave(){const s=$('#saveStatus');if(s)s.textContent='Saving…';clearTimeout(saveTimer);saveTimer=setTimeout(()=>{persist();if($('#saveStatus'))$('#saveStatus').textContent='All changes saved'},350)}

function transferStatus(message,isError=false){const el=$('#transferStatus');if(el){el.textContent=message;el.style.color=isError?'#b35b4e':'var(--accent)'}}
function bytesToB64(bytes){let bin='';for(let i=0;i<bytes.length;i+=0x8000)bin+=String.fromCharCode(...bytes.subarray(i,i+0x8000));return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function b64ToBytes(value){const b64=value.replace(/-/g,'+').replace(/_/g,'/');const bin=atob(b64+'='.repeat((4-b64.length%4)%4));return Uint8Array.from(bin,c=>c.charCodeAt(0))}
async function deriveTransferKey(pass,salt){const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function packTransfer(){
 const pass=$('#transferPass').value;
 if(pass.length<10)throw Error('Use a passphrase with at least 10 characters.');
 if(!crypto?.subtle)throw Error('Secure encryption needs a modern browser on HTTPS or localhost.');
 const payload=new TextEncoder().encode(JSON.stringify({...state,exportedAt:now(),app:'Notebook',transferVersion:1}));
 let bytes=payload,compressed=false;
 if('CompressionStream' in window){const stream=new Blob([payload]).stream().pipeThrough(new CompressionStream('gzip'));bytes=new Uint8Array(await new Response(stream).arrayBuffer());compressed=true}
 const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),key=await deriveTransferKey(pass,salt);
 const encrypted=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,bytes));
 return 'NOTEFUL1.'+[compressed?'g':'n',bytesToB64(salt),bytesToB64(iv),bytesToB64(encrypted)].join('.');
}
async function unpackTransfer(code,pass){
 if(!crypto?.subtle)throw Error('Secure decryption needs a modern browser on HTTPS or localhost.');
 const parts=code.trim().split('.');
 if(parts.length!==5||parts[0]!=='NOTEFUL1'||!['g','n'].includes(parts[1]))throw Error('That does not look like a valid Notebook transfer code.');
 const salt=b64ToBytes(parts[2]),iv=b64ToBytes(parts[3]),cipher=b64ToBytes(parts[4]);
 const key=await deriveTransferKey(pass,salt);
 let bytes;
 try{bytes=new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv},key,cipher))}catch{throw Error('Could not unlock this code. Check the passphrase and make sure the code was copied completely.')}
 if(parts[1]==='g'){if(!('DecompressionStream' in window))throw Error('This browser cannot decompress this transfer. Use a recent version of Chrome, Edge, Firefox, or Safari.');bytes=new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer())}
 const data=JSON.parse(new TextDecoder().decode(bytes));
 if(!data||!Array.isArray(data.pages)||!Array.isArray(data.tasks)||!Array.isArray(data.collections)||!Array.isArray(data.trash)||!data.settings)throw Error('The decrypted code is not a valid Folio Space workspace.');
 return data;
}

async function encryptAnyWithPass(data,pass){
 if(pass.length<10)throw Error('Use a passkey with at least 10 characters.');
 if(!window.isSecureContext||!crypto?.subtle)throw Error('Secure encryption needs HTTPS or localhost.');
 const raw=new TextEncoder().encode(JSON.stringify(data));let bytes=raw,compressed=false;
 if('CompressionStream' in window){bytes=new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer());compressed=true}
 const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),key=await deriveTransferKey(pass,salt);
 const encrypted=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,bytes));
 return 'NOTEFUL1.'+[compressed?'g':'n',bytesToB64(salt),bytesToB64(iv),bytesToB64(encrypted)].join('.');
}
async function decryptAnyWithPass(code,pass){
 if(!window.isSecureContext||!crypto?.subtle)throw Error('Secure decryption needs HTTPS or localhost.');
 const parts=code.trim().split('.');if(parts.length!==5||parts[0]!=='NOTEFUL1'||!['g','n'].includes(parts[1]))throw Error('This online item is not a valid Notebook transfer.');
 const salt=b64ToBytes(parts[2]),iv=b64ToBytes(parts[3]),cipher=b64ToBytes(parts[4]),key=await deriveTransferKey(pass,salt);let bytes;
 try{bytes=new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv},key,cipher))}catch{throw Error('Could not unlock this item. Check the code and passkey.')}
 if(parts[1]==='g'){if(!('DecompressionStream' in window))throw Error('This browser cannot decompress this transfer. Update your browser.');bytes=new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer())}
 return JSON.parse(new TextDecoder().decode(bytes));
}

async function cloudRequest(method,code,payload){
 if(location.protocol==='file:')throw Error('Online transfer is not available when opening the HTML file directly. Deploy Notebook to Cloudflare Pages with Functions enabled, then open its HTTPS address.');
 const url=new URL('/api/transfers',location.origin);if(code)url.searchParams.set('code',code);
 const options={method,headers:{'content-type':'application/json'}};
 if(method==='POST')options.body=JSON.stringify({code,payload});
 let res;try{res=await fetch(url.toString(),options)}catch(e){throw Error('Notebook could not reach its online API. This usually means the Cloudflare Pages Function was not deployed, the site is hosted on a static-only host, or your connection is offline. Deploy the whole folder with Cloudflare Pages Git integration or Wrangler (not a drag-and-drop static upload), then try again.');}
 let data={};try{data=await res.json()}catch{}
 if(!res.ok){if(res.status===404)throw Error('Online API route not found. Deploy the functions/api/transfers.js file with Cloudflare Pages Functions; static-only hosting will not run it.');if(res.status===503)throw Error(data.error||'Cloud storage is not connected. Add the NOTEFUL_TRANSFERS KV binding in Cloudflare Pages Settings → Bindings, then redeploy.');throw Error(data.error||`Online transfer failed (${res.status}). Check the Cloudflare setup.`)}
 return data;
}

 $('#cloudCreate')?.addEventListener('click',async()=>{const button=$('#cloudCreate'),pass=$('#cloudPass').value;if(pass.length<10){cloudStatus('Use a passkey with at least 10 characters.',true);return}if(!window.isSecureContext||!crypto?.subtle){cloudStatus('Secure encryption needs HTTPS or localhost.',true);return}button.disabled=true;cloudStatus('Encrypting your workspace in this browser…');try{const payload=await packTransferWithPass(pass);let code=makeCloudCode(),created=false;for(let i=0;i<3&&!created;i++){try{await cloudRequest('POST',code,payload);created=true}catch(e){if(!String(e.message).includes('already exists'))throw e;code=makeCloudCode()}}if(!created)throw Error('Could not reserve a unique code. Try again.');$('#cloudCode').value=code;cloudStatus('Encrypted snapshot uploaded. Save this code and passkey. It remains online until deleted.');toast('Online transfer created')}catch(e){cloudStatus(e.message||'Could not upload transfer.',true)}finally{button.disabled=false}});

function emojiPicker(p){const emojis=['📄','📝','💡','📚','🧠','🎯','🚀','🌱','🌿','✨','💻','🧩','📌','🗓️','📖','🎨','💬','🔬','☕','❤️','⭐','🏡','🛠️','🌈'];$('#modal').innerHTML=`<div class="modal-head"><h2>Choose an icon</h2><button class="icon-btn" data-close>×</button></div><div class="modal-body"><div style="display:grid;grid-template-columns:repeat(6,1fr);gap:7px">${emojis.map(e=>`<button data-emoji="${e}" style="font-size:24px;padding:10px;border:1px solid var(--line);border-radius:9px">${e}</button>`).join('')}</div></div>`;showModal();bindClose();$$('[data-emoji]').forEach(b=>b.onclick=()=>{p.emoji=b.dataset.emoji;persist();closeModal();renderEditor()})}
function movePage(p){const opts=[{id:'',name:'No collection'},...state.collections];$('#modal').innerHTML=`<div class="modal-head"><h2>Move to collection</h2><button class="icon-btn" data-close>×</button></div><div class="modal-body"><div class="field"><label>COLLECTION</label><select id="collectionSelect">${opts.map(c=>`<option value="${esc(c.id)}" ${p.collection===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div class="modal-footer"><button class="secondary" data-close>Cancel</button><button class="primary" id="moveConfirm">Move page</button></div></div>`;showModal();bindClose();$('#moveConfirm').onclick=()=>{p.collection=$('#collectionSelect').value||null;p.updated=now();persist();closeModal();toast('Page moved');renderEditor()}}
function pageMenu(p){$('#modal').innerHTML=`<div class="modal-head"><h2>Page options</h2><button class="icon-btn" data-close>×</button></div><div class="modal-body"><button class="nav-item" id="duplicatePage">▣ &nbsp; Duplicate page</button><button class="nav-item" id="exportPage">↧ &nbsp; Export this page</button><button class="nav-item" id="deleteFromMenu" style="color:#b15b4d">♲ &nbsp; Move to trash</button></div>`;showModal();bindClose();$('#duplicatePage').onclick=()=>{makePage({...p,id:undefined,title:p.title+' (copy)',favorite:false,created:now(),updated:now()});closeModal()};$('#exportPage').onclick=()=>{const b=new Blob([`# ${p.title}\n\n${p.description||''}\n\n${p.content.replace(/<\/(p|h[1-6]|li|blockquote|div)>/gi,'\n').replace(/<[^>]*>/g,'').replace(/&nbsp;/g,' ')}`],{type:'text/markdown'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=(p.title||'page').replace(/[^a-z0-9-_]/gi,'-').toLowerCase()+'.md';a.click();URL.revokeObjectURL(a.href);closeModal();toast('Page exported')};$('#deleteFromMenu').onclick=()=>{closeModal();$('#deletePage').click()}}
function searchOpen(){searchItems=[...state.pages].sort((a,b)=>new Date(b.updated)-new Date(a.updated));searchIndex=0;$('#searchInput').value='';renderSearch('');$('#searchOverlay').classList.add('show');$('#searchInput').focus()}function searchClose(){$('#searchOverlay').classList.remove('show')}function renderSearch(q){const results=searchItems.filter(p=>(p.title+' '+p.description+' '+p.content.replace(/<[^>]+>/g,' ')).toLowerCase().includes(q.toLowerCase()));$('#searchResults').innerHTML=results.length?results.map((p,i)=>`<button class="page-row" data-search-open="${esc(p.id)}" style="width:100%;text-align:left;border:0;border-radius:8px;background:${i===searchIndex?'var(--hover)':'transparent'}"><span class="page-emoji">${esc(p.emoji||'📄')}</span><span style="min-width:0"><span class="page-title" style="display:block">${esc(p.title)}</span><span class="page-meta">${esc(p.description||categoryName(p.category))}</span></span><span class="row-arrow">↵</span></button>`).join(''):`<div class="empty">No pages found for “${esc(q)}”</div>`;$$('[data-search-open]').forEach(b=>b.onclick=()=>{searchClose();openPage(b.dataset.searchOpen)})}
$('#searchBtn').onclick=searchOpen;$('#searchOverlay').addEventListener('click',e=>{if(e.target===$('#searchOverlay'))searchClose()});$('#searchInput').addEventListener('input',e=>{searchIndex=0;renderSearch(e.target.value)});$('#searchInput').addEventListener('keydown',e=>{let n=$$('#searchResults [data-search-open]').length;if(e.key==='Escape')searchClose();if(e.key==='ArrowDown'){e.preventDefault();searchIndex=Math.min(searchIndex+1,n-1);renderSearch(e.target.value)}if(e.key==='ArrowUp'){e.preventDefault();searchIndex=Math.max(0,searchIndex-1);renderSearch(e.target.value)}if(e.key==='Enter'){const b=$$('#searchResults [data-search-open]')[searchIndex];if(b){searchClose();openPage(b.dataset.searchOpen)}}});
$('#newPageBtn').onclick=()=>showCreateModal('notes');$$('.nav-item[data-view]').forEach(b=>b.onclick=()=>navigate(b.dataset.view));$('#themeBtn').onclick=toggleTheme;$('#mobileMenu').onclick=()=>$('#sidebar').classList.toggle('open');$('#profileEdit').onclick=()=>navigate('settings');$('#workspaceMenu').onclick=()=>navigate('settings');$('#addCollection').onclick=()=>{const name=prompt('Name your collection:');if(!name?.trim())return;state.collections.push({id:uid(),name:name.trim(),emoji:'◈'});persist();renderCollections();toast('Collection created')};document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();searchOpen()}if(e.key==='Escape'){searchClose();$('#slashMenu').classList.remove('show');$('#sidebar').classList.remove('open')}});document.addEventListener('click',e=>{if(!e.target.closest('#slashMenu')&&!e.target.closest('#editor'))$('#slashMenu').classList.remove('show')});
applyTheme();render();
})();
</script></body></html>
